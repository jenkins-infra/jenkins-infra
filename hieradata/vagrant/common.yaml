---
lookup_options:
  "^profile::jenkinscontroller::jcasc$":
    merge:
      strategy: deep
      merge_hash_arrays: true
  "^letsencrypt":
    merge:
      strategy: deep
      merge_hash_arrays: true
profile::jenkinscontroller::letsencrypt: false
letsencrypt::enable: false # TODO use this setting on all profiles (see usage.yaml)
# Per-host Datadog configuration
datadog_agent::host: "vagrant.local"
datadog_agent::non_local_traffic: true # Allow jenkins container to contact the agent for metrics
datadog_agent::apm_enabled: true
datadog_agent::apm_non_local_traffic: true # Allow jenkins container to contact the agent for traces and logs
datadog_agent::agent_extra_options:
  bind_host: "0.0.0.0" # All hosts interfaces to allow container access
usage_ssh_privkey: |
  -----BEGIN RSA PRIVATE KEY-----
  overridewith_usage_ssh_privkey
  -----END RSA PRIVATE KEY-----
osuosl_mirroring::privkey: |
  -----BEGIN RSA PRIVATE KEY-----
  overridewith_osuosl_mirroring privkey
  -----END RSA PRIVATE KEY-----
archives_jenkins_io_mirroring::privkey: |
  -----BEGIN RSA PRIVATE KEY-----
  override_with_archives_privkey
  -----END RSA PRIVATE KEY-----
profile::jenkinscontroller::ci_fqdn: 'localhost'
profile::jenkinscontroller::ci_resource_domain: 'assets.localhost'
profile::jenkinscontroller::additional_fqdns:
  foo.localhost:
    isalias: true
  legacy.localhost: null
profile::jenkinscontroller::memory_limit: '14g'
profile::jenkinscontroller::authenticated_access: true
profile::jenkinscontroller::embeddable_build_status: true # Requires embeddable-build-status plugin installed, groovy_init_enabled set to true and groovy_d_lock_down_jenkins set to 'present'
profile::jenkinscontroller::groovy_init_enabled: true
profile::jenkinscontroller::groovy_d_lock_down_jenkins: present
profile::jenkinscontroller::admin_users:
  - vagrantadmin
profile::jenkinscontroller::jcasc:
  enabled: true
  reload_token: SuperSecretThatShouldBeEncryptedInProduction
  datadog_api_key: SuperSecretThatShouldBeEncryptedInProduction
  unclassified:
    data: |-
      buildDiscarders:
          configuredBuildDiscarders:
          - "jobBuildDiscarder"
          - defaultBuildDiscarder:
              discarder:
                logRotator:
                  numToKeepStr: "5"
        # Weird indentation: we would expect 2 less spaces below
        # but hierdata is behaving weirdly (bug in YAML parser?)
        defaultDisplayUrlProvider:
          providerId: "org.jenkinsci.plugins.displayurlapi.ClassicDisplayURLProvider"
      # Allow to check authenticated_access in http://localhost:8080/manage/configureSecurity/
      jenkins:
        securityRealm:
          local:
            allowsSignup: false
            users:
              - id: vagrantadmin
                password: butler
              - id: developer
                password: butler
      credentials:
          system:
            domainCredentials:
              - credentials:
                - basicSSHUserPrivateKey:
                    description: "Dummy (e.g. not working, clear value) SSH key"
                    id: "dummy-ssh-jenkins"
                    privateKeySource:
                      directEntry:
                        privateKey: "DummyValueOnlyForTestingNotASecurityIssue"
                    scope: SYSTEM
                    username: "jenkins"
  jenkins_global:
    location: http://127.0.0.1:8080
    resourceRootUrl: http://localhost:8080
  appearance:
    pipeline_graph_view:
      on_build_page: true
      on_job_page: false
  tools:
    groovy:
      groovy: # Default version is named "groovy"
        version: "2.4.21"
    generic:
      groovy-4.0.22:
        url: "https://groovy.jfrog.io/artifactory/dist-release-local/groovy-zips/apache-groovy-binary-4.0.22.zip"
      groovy-5:
        url: "https://groovy.jfrog.io/artifactory/dist-release-local/groovy-zips/apache-groovy-binary-5.0.7.zip"
        subdir: groovy-5.0.7
    jdk:
      jdk8:
        installers:
          linux-arm64: "(linux && arm64) || linux-arm64"
      jdk11:
        installers:
          linux-arm64: "(linux && arm64) || linux-arm64"
          s390x: "s390x || s390xdocker"
      jdk17:
        installers:
          linux-arm64: "(linux && arm64) || linux-arm64"
          s390x: "s390x || s390xdocker"
      jdk21:
        installers:
          linux-arm64: "(linux && arm64) || linux-arm64"
          s390x: "s390x || s390xdocker"
      jdk25:
        installers:
          linux-arm64: "(linux && arm64) || linux-arm64"
          s390x: "s390x || s390xdocker"
  permanent_agents:
    s390x-agent:
      remoteFS: /home/jenkins/agent
      labels:
        - s390x
        - s390xdocker
      mode: EXCLUSIVE
      ssh:
        host: "148.100.84.76"
        credentialsId: dummy-ssh-jenkins
        hostKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIaGnnWz9Q/MvlscCUZslFxH8JJ01OQ6FXyuQMQWVuNe"
      envVars:
        PATH+MAVEN: /home/jenkins/tools/apache-maven-3.9.15/bin
        JAVA_HOME: /opt/jdk-21
  cloud_agents:
    ## IMPORTANT for EC2Fleet: JCasC (and controller) fails to load if the specified fleets are not mapped to a real AWS ASG/Fleet. \
    ## As such a valid AWS credential is required and passed through the local environment variable `JENKINS_EC2_FLEET_AWS_SECRET_KEY` read by Vagrant. \
    ## Alternatively you can comment out the EC2Fleet block above. Remember: no credential in persistant files on your machine!
    eC2Fleet:
      sshCredential: dummy-ssh-jenkins
      region: us-east-2
      # Value from https://github.com/jenkins-infra/terraform-states/tree/main/aws-sponsored (terraform output ec2fleet_vagrant_access_key_id)
      awsAccessKeyId: AKIAUYEMYSOUELITHJ6Z
      # Read by vagrant. Environment variable value from https://github.com/jenkins-infra/terraform-states/tree/main/aws-sponsored (terraform output ec2fleet_vagrant_access_key_secret_access_key)
      awsSecretKeyEnvName: JENKINS_EC2_FLEET_AWS_SECRET_KEY # Passed by Vagrant as an env. var
      fleets:
        - os: windows
          osVersion: 2025
          jdks: [8, 11, 17, 21, 25]
          defaultJdk: 21
          pricingTypes: ["spot", "ondemand"]
          maxSize: 50
          autoMavenLabels: true
          autoDefaultOSLabel: true
        - customName: "infratest"
          os: windows
          osVersion: 2025
          jdks: [21]
          pricingTypes: ["spot"]
          maxSize: 7
          autoMavenLabels: false
          autoDefaultOSLabel: false
          customLabels: windows-infratest
        - os: windows
          osVersion: 2022
          jdks: [21]
          pricingTypes: ["spot", "ondemand"]
          maxSize: 20
          autoDefaultOSLabel: true
        - os: windows
          osVersion: 2019
          jdks: [21]
          pricingTypes: ["spot", "ondemand"]
          # maxSize: 20 # Commented to "test" the default value in the ERB template
          autoDefaultOSLabel: true
        - customName: "infratest"
          os: ubuntu
          osVersion: 22.04
          jdks: [21]
          pricingTypes: ["spot"]
          maxSize: 5
          autoMavenLabels: false
          autoDefaultOSLabel: false
          customLabels: linux-infratest
        - os: ubuntu
          osVersion: 22.04
          jdks: [21]
          pricingTypes: ["spot", "ondemand"]
          maxSize: 50
          autoDefaultOSLabel: true
          autoMavenLabels: false
          customLabels: linux-amd64 docker vm linux amd64
        - os: ubuntu
          osVersion: 22.04
          architecture: arm64
          jdks: [21]
          pricingTypes: ["spot"]
          maxSize: 50
          autoDefaultOSLabel: false
          autoMavenLabels: false
          customLabels: arm64docker arm64linux linux-arm64
        - customName: "highmem"
          os: ubuntu
          osVersion: 22.04
          jdks: [21]
          pricingTypes: ["spot", "ondemand"]
          maxSize: 50
          autoDefaultOSLabel: false
          autoMavenLabels: false
          customLabels: linux-amd64-big highmem highram docker-highmem
    kubernetes:
      first-cluster:
        enabled: true
        provider: "azure"
        credentialsId: "first-cluster-jenkins-agent-sa-token"
        serverCertificate: SuperSecretThatShouldBeEncryptedInProduction
        max_capacity: 150
        url: SuperSecretThatShouldBeEncyptedInProduction
        defaultNamespace: jenkins-agents
        acpServerId: internal
        imageNamePrefix: "urltobeprovided.amazonaws.com/docker-hub/"
        agent_definitions:
          - name: jnlp-maven-bom
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-17
            labels:
              - maven-bom
            cpus: 4
            memory: 8
            nodeSelector: "ci.jenkins.io/agents-density=3"
            tolerations:
              - key: "ci.jenkins.io/bom"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
          - name: jnlp-maven-8
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-8
            labels:
              - maven
              - maven-8
              - jdk8
            cpus: 4
            memory: 8
            imagePullSecrets: dockerhub-credential
          - name: jnlp-maven-11
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-11
            labels:
              - maven-11
              - jdk11
            cpus: 4
            memory: 8
            imagePullSecrets: dockerhub-credential
          - name: jnlp-maven-17
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-17
            labels:
              - maven-17
              - jdk17
            cpus: 4
            memory: 8
            imagePullSecrets: dockerhub-credential
          - name: jnlp-maven-21
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-21
            labels:
              - maven-21
              - jdk21
              - node
              - webbuilder
              - ruby
            cpus: 4
            memory: 8
            imagePullSecrets: dockerhub-credential
            additionalPVCs:
              - claimName: ci-jenkins-io-maven-cache-readwritemany
                mountPath: "/cache-rw"
                readOnly: false
      second-cluster:
        enabled: true
        provider: azure
        credentialsId: "second-cluster-jenkins-agent-sa-token"
        serverCertificate: SuperSecretThatShouldBeEncryptedInProduction
        max_capacity: 30 # Max 10 workers (16 CPU / 32 G) with 3 pods (3*4 CPU / 3*8G) each
        url: SuperSecretThatShouldBeEncryptedInProduction
        defaultNamespace: jenkins-agents
        # No agent definitions (to test an empty cloud)
    azure_vm_agents:
      clouds:
        azure-vms:
          azureCredentialsId: azure-credentials
          resourceGroup: ci-jenkins-io-ephemeral-agents
          virtualNetworkName: "vnet"
          virtualNetworkResourceGroupName: "vnet-rg"
          subnetName: "vnet-agents"
          storageAccount: SuperSecretEncryptedInProduction
          acpServerId: internal
        azure-vms-secondary:
          azureCredentialsId: "azure-secondary-credentials" # Managed manually
          resourceGroup: ci-jenkins-io-ephemeral-agents-secondary
          maxInstances: 50 # Mandatory to set otherwise it's 10 by default. Worst case: 50 of 8 vCPUS = 400 which is the maximum quota
          virtualNetworkName: "vnet-secondary"
          virtualNetworkResourceGroupName: "vnet-secondary-rg"
          subnetName: "vnet-secondary-subnet-agents"
          disableSpot: true # Not enough quota available
          storageAccount: SuperSecretEncryptedInProductionSecondary
          acpServerId: external
          userInstanceIdentity: '/subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/{userAssignedIdentityName}'
      agent_definitions:
        - name: "ubuntu-22-inbound"
          description: "Ubuntu 22.04 LTS"
          imageDefinition: jenkins-agent-ubuntu-22.04-amd64
          os: "ubuntu"
          os_version: "22.04"
          launcher: "inbound"
          location: "East US 2"
          instanceType: Standard_D4ads_v7 # 4 vCPUS / 16 Gb / Max 150 Gb local storage
          ephemeralOSDisk: true
          architecture: amd64
          labels:
            - java
            - docker
            - linux-amd64
          maxInstances: 50
          useAsMuchAsPossible: true
          credentialsId: "jenkinsvmagents-userpass"
          usePrivateIP: true
          spot: true
        - name: "ubuntu-22-amd64-maven17"
          description: "Ubuntu 22.04 LTS with JDK17 set as default java CLI"
          imageDefinition: jenkins-agent-ubuntu-22.04-amd64
          os: "ubuntu"
          os_version: "22.04"
          launcher: "inbound"
          location: "East US 2"
          instanceType: Standard_D4ads_v7 # 4 vCPUS / 16 Gb / Max 150 Gb local storage
          ephemeralOSDisk: true
          architecture: amd64
          labels:
            - ubuntu-22-amd64-maven17
          javaHome: /opt/jdk-17
          maxInstances: 50
          useAsMuchAsPossible: true
          credentialsId: "jenkinsvmagents-userpass"
          usePrivateIP: true
          spot: true
        - name: "ubuntu-22-amd64-maven21"
          description: "Ubuntu 22.04 LTS with JDK21 set as default java CLI"
          imageDefinition: jenkins-agent-ubuntu-22.04-amd64
          os: "ubuntu"
          os_version: "22.04"
          launcher: "inbound"
          location: "East US 2"
          instanceType: Standard_D4ads_v7 # 4 vCPUS / 16 Gb / Max 150 Gb local storage
          ephemeralOSDisk: true
          architecture: amd64
          labels:
            - ubuntu-22-amd64-maven21
          javaHome: /opt/jdk-21
          maxInstances: 50
          useAsMuchAsPossible: true
          credentialsId: "jenkinsvmagents-userpass"
          usePrivateIP: true
          spot: true
        - name: "ubuntu-22-arm64-ssh"
          description: "Ubuntu 22.04 LTS ARM64"
          imageDefinition: jenkins-agent-ubuntu-22.04-arm64
          os: "ubuntu"
          os_version: "22.04"
          launcher: "ssh"
          location: "East US 2"
          instanceType: Standard_D4pds_v7 # 4 vCPUS / 16 Gb / Max 150 Gb local storage
          ephemeralOSDisk: true
          architecture: arm64
          labels:
            - arm64docker
            - arm64linux
          maxInstances: 50
          useAsMuchAsPossible: true
          credentialsId: "jenkinsvmagents-userpass"
          usePrivateIP: true
          javaHome: /opt/jdk-11 # Test override of the default JDK for builds
          agentJavaBin: /opt/jdk-17 # Test override of the default JDK for builds
          userInstanceIdentity: '/specific/value/which/overrides/cloud/default'
        - name: "win-2019-inbound" # The name must not contains "windows" or Azure API complains :facepalm:
          description: "Windows 2019"
          imageDefinition: jenkins-agent-windows-2019-amd64
          os: "windows"
          os_version: "2019"
          launcher: "inbound"
          location: "East US 2"
          instanceType: Standard_D4ads_v7 # 4 vCPUS / 16 Gb / Max 150 Gb local storage
          ephemeralOSDisk: true
          architecture: amd64
          labels:
            - docker-windows
            - docker-windows-2019
            - win-2019
            - win-2019-amd64-maven-11
          javaHome: 'C:/Tools/openjdk-11' # Test override of the default JDK for builds
          maxInstances: 50
          useAsMuchAsPossible: true
          credentialsId: "jenkinsvmagents-userpass"
          usePrivateIP: true
          spot: true
          agentJavaBin: 'C:/Tools/openjdk-17' # Test override of the default JDK for builds
        - name: "win-2022-ssh" # The name must not contains "windows" or Azure API complains :facepalm:
          description: "Windows 2022"
          imageDefinition: jenkins-agent-windows-2022-amd64
          os: "windows"
          os_version: "2022"
          location: "East US 2"
          instanceType: Standard_D4ads_v7 # 4 vCPUS / 16 Gb / Max 150 Gb local storage
          ephemeralOSDisk: true
          architecture: amd64
          labels:
            - docker-windows-2022
          maxInstances: 50
          useAsMuchAsPossible: true
          credentialsId: "jenkinsvmagents-userpass"
          usePrivateIP: true
          spot: false
        - name: "win-2025-ssh" # The name must not contains "windows" or Azure API complains :facepalm:
          description: "Windows 2025"
          imageDefinition: jenkins-agent-windows-2025-amd64
          os: "windows"
          os_version: "2025"
          location: "East US 2"
          instanceType: Standard_D4ads_v7 # 4 vCPUS / 16 Gb / Max 150 Gb local storage
          ephemeralOSDisk: true
          architecture: amd64
          labels:
            - docker-windows-2025
          maxInstances: 50
          useAsMuchAsPossible: true
          credentialsId: "jenkinsvmagents-userpass"
          usePrivateIP: true
          spot: false
  artifact_caching_proxy:
    enabled: true
    servers:
      internal:
        name: Dummy Internal Artifact Caching Proxy
        url: http://127.0.0.1:8080/
      external:
        name: Dummy External Artifact Caching Proxy
        url: http://external:8080/
        credentials: "credentialIdInJenkins"
  artifacts_manager:
    type: s3
    enable: false
    credentialsId: aws-s3-artifact-manager
    region: us-east-2
    storage_name: superbucketname
  datadog:
    host: "vagrant.local"
    targetHost: "172.18.0.1" # docker0 interface in vagrant is non standard (because docker in docker)
    collectBuildLogs: true
# These are plugins we need in our ci environment
profile::jenkinscontroller::plugins:
  - ansicolor
  - build-timeout
  - buildtriggerbadge
  - build-discarder # Remove older builds if no policy defined - https://github.com/jenkins-infra/helpdesk/issues/3495
  - cloudbees-folder
  - coverage
  - coverage-badges-extension
  - credentials
  - credentials-binding
  - embeddable-build-status
  - git-client
  - git
  - github
  - github-checks
  - github-branch-source
  - groovy
  - junit-attachments
  - junit-realtime-test-reporter
  - ldap
  - lockable-resources
  - mailer
  - matrix-auth
  - parallel-test-executor
  - pipeline-githubnotify-step
  - pipeline-github # This plugin adds the following pipeline triggers: issueCommentTrigger, pullRequestReview
  - pipeline-graph-analysis # Library plugin
  - pipeline-stage-view
  - pipeline-utility-steps
  - ssh-agent # SSH Agent to allow loading SSH credentials on a local agent for jobs
  - throttle-concurrents
  - timestamper
  - warnings-ng
profile::awscli::version: 2.36.38
profile::jenkinscontroller::kubeconfigs:
  # Case of cluster which user requires a token
  - cluster_name: azure_cluster
    cluster_url: https://azure_cluster.url
    cluster_ca_data: SuperSecretCAdata
    client_ca_data: SuperSecretClientCAdata
    client_key_data: SuperSecretClientKeydata
    client_token: SuperSecretClientToken
  # Case of cluster which requires instance profile (and aws CLI)
  - cluster_name: aws_cluster
    cluster_url: https://aws_cluster.url
    cluster_ca_data: SuperSecretCAdata
    cluster_aws_region: us-east-2
profile::aznfs::mounts:
  - mountpoint: "/updates-jenkins-io-data"
    url: "updatesjenkinsio.file.core.windows.net:/updatesjenkinsio/updates-jenkins-io-data"
