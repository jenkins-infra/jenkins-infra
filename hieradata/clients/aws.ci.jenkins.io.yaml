                mountPath: "/cache"
                readOnly: true
    eC2Fleet:
      sshCredential: ec2-agent-ssh
      region: us-east-2
      fleets:
        - os: windows
          osVersion: 2025
          jdks: [8, 11, 17, 21, 25]
          defaultJdk: 21
          pricingTypes: ["spot", "ondemand"]
