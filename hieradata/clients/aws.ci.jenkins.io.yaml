lookup_options:
  "^profile::jenkinscontroller::jcasc$":
    merge:
      strategy: deep
      merge_hash_arrays: true
# Per-host Datadog configuration
datadog_agent::host: 'aws.ci.jenkins.io'
datadog_agent::non_local_traffic: true # Allow jenkins container to contact the agent for metrics
datadog_agent::apm_enabled: true
datadog_agent::apm_non_local_traffic: true # Allow jenkins container to contact the agent for traces and logs
datadog_agent::agent_extra_options:
  bind_host: "0.0.0.0" # All hosts interfaces to allow container access
profile::jenkinscontroller::anonymous_access: true
profile::jenkinscontroller::admin_ldap_groups:
  - admins
  - jenkins-admins
profile::jenkinscontroller::ci_fqdn: 'ci.jenkins.io'
profile::jenkinscontroller::ci_resource_domain: 'assets.ci.jenkins.io'
profile::jenkinscontroller::additional_fqdns:
  aws.ci.jenkins.io:
    isalias: true
  assets.aws.ci.jenkins.io:
    isalias: true
  ci.jenkins-ci.org: null
profile::jenkinscontroller::letsencrypt: true
profile::jenkinscontroller::docker_image: 'jenkins/jenkins'
profile::jenkinscontroller::docker_tag: 'lts-jdk21'
profile::jenkinscontroller::groovy_init_enabled: true
profile::jenkinscontroller::block_remote_access_api: true
profile::jenkinscontroller::groovy_d_lock_down_jenkins: 'present'
profile::jenkinscontroller::groovy_d_set_up_git: 'present'
profile::jenkinscontroller::memory_limit: '30g'
profile::jenkinscontroller::jcasc:
  enabled: true
  reload_token: ENC[PKCS7,]
  datadog_api_key: ENC[PKCS7,]
  unclassified:
    data: |-
      buildDiscarders:
          configuredBuildDiscarders:
          - "jobBuildDiscarder"
          - defaultBuildDiscarder:
              discarder:
                logRotator:
                  numToKeepStr: "5"
        # Weird indentation: we would expect 2 less spaces below
        # but hieradata is behaving weirdly (bug in YAML parser?)
        defaultDisplayUrlProvider:
          providerId: "org.jenkinsci.plugins.displayurlapi.ClassicDisplayURLProvider"
  csp-plugin:
    reportOnly: true
    rule: |-
      "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: avatars.githubusercontent.com; media-src 'self' data: ; script-src 'self' 'report-sample' usage.jenkins.io;"
  appearance:
    pipeline_graph_view:
      on_build_page: true
      on_job_page: false
  tools:
    groovy:
      groovy: # Default version is named "groovy"
        version: "2.4.21"
    jdk:
      jdk8:
        installers:
          linux-arm64: "(linux && arm64) || linux-arm64"
      jdk11:
        installers:
          linux-arm64: "(linux && arm64) || linux-arm64"
          s390x: "s390x || s390xdocker"
      jdk17:
        installers:
          linux-arm64: "(linux && arm64) || linux-arm64"
          s390x: "s390x || s390xdocker"
      jdk21:
        installers:
          linux-arm64: "(linux && arm64) || linux-arm64"
          s390x: "s390x || s390xdocker"
      jdk25:
        installers:
          linux-arm64: "(linux && arm64) || linux-arm64"
          s390x: "s390x || s390xdocker"
  artifact_caching_proxy:
    enabled: true
    servers:
      aws-internal:
        name: AWS (Internal) Artifact Caching Proxy
        # TODO: maintain with updatecli from jenkins-infra/kubernetes-management
        # Note: ending slash is required
        url: http://k8s-artifact-artifact-3d1949c260-a3739c22ffe2d924.elb.us-east-2.amazonaws.com:8080/
      aws-eks-internal:
        name: AWS (EKS Internal) Artifact Caching Proxy
        # TODO: maintain with updatecli from jenkins-infra/kubernetes-management
        url: http://artifact-caching-proxy.artifact-caching-proxy.svc.cluster.local:8080/
  artifacts_manager:
    enable: true
    type: s3
    region: us-east-2
    storage_name: aws-ci-jenkins-io-artifacts
  datadog:
    host: "aws.ci.jenkins.io"
    targetHost: "172.17.0.1" # docker0 interface
    collectBuildLogs: true
  permanent_agents:
    s390x-agent:
      remoteFS: /home/jenkins/agent
      labels:
        - s390x
        - s390xdocker
      mode: EXCLUSIVE
      ssh:
        host: "148.100.84.76"
        credentialsId: "jenkins-s390x"
        hostKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIaGnnWz9Q/MvlscCUZslFxH8JJ01OQ6FXyuQMQWVuNe"
      envVars:
        PATH+MAVEN: /home/jenkins/tools/apache-maven-3.9.11/bin
        JAVA_HOME: /opt/jdk-21
      toolLocation:
        - home: /home/jenkins/tools/apache-maven-3.9.11
          key: "hudson.tasks.Maven$MavenInstallation$DescriptorImpl@mvn"
  cloud_agents:
    kubernetes:
      ci.jenkins.io-agents-2:
        enabled: true
        ## Note: no URL/credential/CA data as we rely on jenkins' KUBECONFIG to allow EC2 instance profile authentication
        # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
        imageNamePrefix: "326712726440.dkr.ecr.us-east-2.amazonaws.com/docker-hub/"
        acpServerId: aws-eks-internal
        # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
        defaultNamespace: jenkins-agents
        # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
        max_capacity: 150
        agent_definitions:
          - name: jnlp-maven-8
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-8
            labels:
              - maven-8
              - jdk8
            cpus: 4
            memory: 12
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            nodeSelector: "role=jenkins-agents"
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            tolerations:
              - key: "ci.jenkins.io/agents"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
            additionalPVCs:
              - claimName: ci-jenkins-io-maven-cache
                mountPath: "/cache"
                readOnly: true
          - name: jnlp-maven-11
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-11
            labels:
              - maven-11
              - jdk11
            cpus: 4
            memory: 12
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            nodeSelector: "role=jenkins-agents"
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            tolerations:
              - key: "ci.jenkins.io/agents"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
            additionalPVCs:
              - claimName: ci-jenkins-io-maven-cache
                mountPath: "/cache"
                readOnly: true
          - name: jnlp-maven-17
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-17
            labels:
              - maven-17
              - jdk17
            cpus: 4
            memory: 12
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            nodeSelector: "role=jenkins-agents"
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            tolerations:
              - key: "ci.jenkins.io/agents"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
            additionalPVCs:
              - claimName: ci-jenkins-io-maven-cache
                mountPath: "/cache"
                readOnly: true
          - name: jnlp-maven-21
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-21
            labels:
              - maven-21
              - jdk21
              - jnlp
              - default
              - node
              - ruby
              - webbuilder
            useAsMuchAsPossible: true # Default template to use when `node() {}` step is called without labels
            cpus: 4
            memory: 12
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            nodeSelector: "role=jenkins-agents"
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            tolerations:
              - key: "ci.jenkins.io/agents"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
            additionalPVCs:
              - claimName: ci-jenkins-io-maven-cache
                mountPath: "/cache"
                readOnly: true
          - name: jnlp-maven-25
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-25
            labels:
              - maven-25
              - jdk25
            cpus: 4
            memory: 12
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            nodeSelector: "role=jenkins-agents"
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            tolerations:
              - key: "ci.jenkins.io/agents"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
            additionalPVCs:
              - claimName: ci-jenkins-io-maven-cache
                mountPath: "/cache"
                readOnly: true
          - name: jnlp-packaging
            agentJavaBin: /opt/jdk-21
            javaHome: /opt/jdk-21
            labels:
              - packaging
              - jnlp-packaging
            cpus: 1
            memory: 1
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            nodeSelector: "role=jenkins-agents"
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            tolerations:
              - key: "ci.jenkins.io/agents"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
      ci.jenkins.io-agents-2-bom:
        enabled: true
        ## Note: no URL/credential/CA data as we rely on jenkins' KUBECONFIG to allow EC2 instance profile authentication
        # TODO: track with updatecli
        imageNamePrefix: "326712726440.dkr.ecr.us-east-2.amazonaws.com/docker-hub/"
        acpServerId: aws-eks-internal
        # TODO: track with updatecli
        defaultNamespace: jenkins-agents-bom
        ## TODO: check if it's needed with EKS and karpenter
        max_capacity: 150 # TODO: Re-evaluate and setup updatecli
        agent_definitions:
          - name: jnlp-maven-bom
            imageName: jnlp-maven-all-in-one
            javaHome: /opt/jdk-21
            labels:
              - maven-bom
            cpus: 4
            memory: 12
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            nodeSelector: "role=jenkins-agents-bom"
            # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/aws-sponsorship.json
            tolerations:
              - key: "ci.jenkins.io/agents"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
              - key: "ci.jenkins.io/bom"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
            additionalPVCs:
              - claimName: ci-jenkins-io-maven-cache
                mountPath: "/cache"
                readOnly: true
    ec2:
      aws-us-east-2:
        region: us-east-2
        useInstanceProfileForCredentials: true
        sshKeysCredentialsId: "ec2-agent-ssh"
        # TODO: maintain with updatecli
        securityGroups: "ephemeral-vm-agents,unrestricted-out-http"
        # TODO: maintain with updatecli
        subnetId: "subnet-0095ee74f5cd48290"
        # TODO: maintain with updatecli
        registryMirror: "k8s-hubmirro-hubmirro-477f7dfd76-9bbe4e560ee83036.elb.us-east-2.amazonaws.com:5000"
        agent_definitions:
          ####
          # x86_64 Linux VMs
          - description: "Spot Ubuntu 22.04 LTS x86_64 with JDK8 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-8
            labels:
              - ubuntu-22-amd64-maven8
            spot: true
            acpServerId: aws-internal
          - description: "Spot Ubuntu 22.04 LTS x86_64 with JDK11 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-11
            labels:
              - ubuntu-22-amd64-maven11
            spot: true
            acpServerId: aws-internal
          - description: "Ubuntu 22.04 LTS x86_64 with JDK17 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-17
            labels:
              - ubuntu-22-amd64-maven17-nonspot
            spot: false
            acpServerId: aws-internal
          - description: "Spot Ubuntu 22.04 LTS x86_64 with JDK17 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-17
            labels:
              - ubuntu-22-amd64-maven17
            spot: true
            acpServerId: aws-internal
          - description: "Spot Ubuntu 22.04 LTS x86_64 with JDK21 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-21
            labels:
              - ubuntu-22-amd64-maven21
              # Labels indicating it is the default VM template
              - linux-amd64
              - java
              - docker
            spot: true
            acpServerId: aws-internal
          - description: "Non Spot Ubuntu 22.04 LTS x86_64 with JDK21 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-21
            labels:
              - ubuntu-22-amd64-maven21-nonspot
              # Note: we need to get rid of these labels from doc. and caller as they can be used either by spot or non spot
              - linux-amd64
              - docker
            spot: false
            acpServerId: aws-internal
          - description: "Spot Ubuntu 22.04 LTS x86_64 with JDK25 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-25
            labels:
              - ubuntu-22-amd64-maven25
            spot: true
            acpServerId: aws-internal
          ####
          # arm64 Linux VMs
          ####
          - description: "Spot Ubuntu 22.04 LTS arm64 with JDK17 set as default java CLI"
            maxInstances: 50
            instanceType: T4gXlarge # 4 vCPUs / 16 Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "arm64"
            javaHome: /opt/jdk-17
            labels:
              - ubuntu-22-arm64-maven17
            spot: true
            acpServerId: aws-internal
          - description: "Spot Ubuntu 22.04 LTS arm64 with JDK21 set as default java CLI"
            maxInstances: 50
            instanceType: T4gXlarge # 4 vCPUs / 16 Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "arm64"
            javaHome: /opt/jdk-21
            labels:
              - ubuntu-22-arm64-maven21
              # Labels indicating it is the default VM template (for arm64)
              - arm64docker
              - arm64linux
              - linux-arm64
            spot: true
            acpServerId: aws-internal
          - description: "Spot Ubuntu 22.04 LTS arm64 with JDK25 set as default java CLI"
            maxInstances: 50
            instanceType: T4gXlarge # 4 vCPUs / 16 Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "arm64"
            javaHome: /opt/jdk-25
            labels:
              - ubuntu-22-arm64-maven25
            spot: true
            acpServerId: aws-internal
          ####
          # High Memory Linux VMs
          ####
          - description: "Ubuntu 22.04 LTS x86_64 High Memory instance with JDK17 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.2xlarge" # 8 vCPUs / 32 Gb / nvme 300Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-17
            labels:
              - ubuntu-22-amd64-highmem-maven17-nonspot
            spot: false
            acpServerId: aws-internal
          # High Memory SPOT Linux VMs (ATH mostly)
          - description: "Spot Ubuntu 22.04 LTS x86_64 High Memory instance with JDK17 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.2xlarge" # 8 vCPUs / 32 Gb / nvme 300Gb            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-17
            labels:
              - ubuntu-22-amd64-highmem-maven17
            spot: true
            acpServerId: aws-internal
          - description: "Spot Ubuntu 22.04 LTS x86_64 High Memory instance with JDK21 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.2xlarge" # 8 vCPUs / 32 Gb / nvme 300Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-21
            labels:
              - ubuntu-22-amd64-highmem-maven21
              # Labels indicating it is the default VM template for high mem x86_64
              - highmem
              - highram
              - docker-highmem
              - linux-amd64-big
              # temporarily adding manually the false label spot to avoid job failure since https://github.com/jenkins-infra/helpdesk/issues/4795
              - spot
            # we switch temporarily to non spot as per https://github.com/jenkins-infra/helpdesk/issues/4795
            spot: false
            acpServerId: aws-internal
          - description: "Ubuntu 22.04 LTS x86_64 High Memory instance with JDK21 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.2xlarge" # 8 vCPUs / 32 Gb / nvme 300Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-21
            labels:
              - ubuntu-22-amd64-highmem-maven21-nonspot
              # Labels indicating it is the default VM template (for arm64)
              - docker-highmem-nonspot
            spot: false
            acpServerId: aws-internal
          - description: "Spot Ubuntu 22.04 LTS x86_64 High Memory instance with JDK25 set as default java CLI"
            maxInstances: 50
            instanceType: "m5ad.2xlarge" # 8 vCPUs / 32 Gb / nvme 300Gb
            os: "ubuntu"
            os_version: "22.04"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: /opt/jdk-25
            labels:
              - ubuntu-22-amd64-highmem-maven25
            spot: true
            acpServerId: aws-internal
          ####
          # Windows VMs
          ####
          ## TODO: deprecate JDK8 Windows?
          - description: "Spot Windows 2019 x86_64 with JDK8"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "windows"
            os_version: "2019"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: 'C:/tools/jdk-8'
            # Utilizes the local NVMe mounted in Z:
            customDataDisk: 'Z:'
            remoteAdmin: jenkins
            labels:
              - win-2019-amd64-maven-8
              - maven-8-windows
            spot: true
            acpServerId: aws-internal
          ## TODO: deprecate JDK11 Windows?
          - description: "Spot Windows 2019 x86_64 with JDK11"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "windows"
            os_version: "2019"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: 'C:/tools/jdk-11'
            # Utilizes the local NVMe mounted in Z:
            customDataDisk: 'Z:'
            remoteAdmin: jenkins
            labels:
              - win-2019-amd64-maven-11
              - maven-11-windows
            spot: true
            acpServerId: aws-internal
          - description: "Spot Windows 2019 x86_64 with JDK17"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "windows"
            os_version: "2019"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: 'C:/tools/jdk-17'
            # Utilizes the local NVMe mounted in Z:
            customDataDisk: 'Z:'
            remoteAdmin: jenkins
            labels:
              - win-2019-amd64-maven-17
              - maven-17-windows
            spot: true
            acpServerId: aws-internal
          - description: "Nonspot Windows 2019 x86_64 with JDK17"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "windows"
            os_version: "2019"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: 'C:/tools/jdk-17'
            # Utilizes the local NVMe mounted in Z:
            customDataDisk: 'Z:'
            remoteAdmin: jenkins
            labels:
              - win-2019-amd64-maven-17-nonspot
              - maven-17-windows-nonspot
            spot: false
            acpServerId: aws-internal
          - description: "Spot Windows 2019 x86_64 with JDK21"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "windows"
            os_version: "2019"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: 'C:/tools/jdk-21'
            # Utilizes the local NVMe mounted in Z:
            customDataDisk: 'Z:'
            remoteAdmin: jenkins
            labels:
              - win-2019-amd64-maven-21
              - maven-21-windows
              # Labels indicating it is the default VM template for Windows 2019 and Windows
              - docker-windows
              - docker-windows-2019
              - win-2019
            spot: true
            acpServerId: aws-internal
          - description: "Nonspot Windows 2019 x86_64 with JDK21"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "windows"
            os_version: "2019"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: 'C:/tools/jdk-21'
            # Utilizes the local NVMe mounted in Z:
            customDataDisk: 'Z:'
            remoteAdmin: jenkins
            labels:
              - maven-21-windows-nonspot
            spot: false
            acpServerId: aws-internal
          - description: "Spot Windows 2019 x86_64 with JDK25"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
            os: "windows"
            os_version: "2019"
            ebsOptimized: true
            architecture: "amd64"
            javaHome: 'C:/tools/jdk-25'
            # Utilizes the local NVMe mounted in Z:
            customDataDisk: 'Z:'
            remoteAdmin: jenkins
            labels:
              - win-2019-amd64-maven-25
              - maven-25-windows
            spot: true
            acpServerId: aws-internal
          - description: "Nonspot Windows 2019 x86_64 with JDK25"
            maxInstances: 50
            instanceType: "m5ad.xlarge" # 4 vCPUs / 16 Gb / nvme 150Gb
