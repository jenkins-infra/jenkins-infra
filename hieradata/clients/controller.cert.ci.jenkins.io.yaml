---
lookup_options:
  "^profile::jenkinscontroller::jcasc$":
    merge:
      strategy: deep
      merge_hash_arrays: true
  "^letsencrypt":
    merge:
      strategy: deep
      merge_hash_arrays: true
profile::jenkinscontroller::ci_fqdn: 'cert.ci.jenkins.io'
profile::jenkinscontroller::proxy_port: 443
docker::log_opt::max-size: "100m"
docker::log_opt::max-file: 2
# Per-host Datadog configuration
datadog_agent::host: "cert.ci.jenkins.io"
profile::jenkinscontroller::letsencrypt: true
profile::letsencrypt::plugin: dns-multi
profile::letsencrypt::dns_azure:
  use_workload_identity: true
  tenant_id: "4c45fef2-1ba7-4120-80a0-9e2d03e9c2b6" # application_tenant_id
  zone:
    name: "cert.ci.jenkins.io"
    subscription: "dff2ec18-6a8e-405c-8e45-b7df7465acf0"
    resource_group_name: "proddns_jenkinsio"
profile::jenkinscontroller::groovy_init_enabled: false
profile::jenkinscontroller::memory_limit: '7g'
profile::jenkinscontroller::jcasc:
  enabled: true
  reload_token: ENC[PKCS7,]
  datadog_api_key: ENC[PKCS7,]
  global_libraries:
    disabled: true
  tools:
    # Multiple Maven versions managed by the controller users (JenSec team)
    maven:
      mvn:
        disabled: true
      maven-3.5:
        version: "3.5.4"
      maven-3.6:
        version: "3.6.3"
      maven-3.8:
        version: "3.8.9"
      maven-3.9:
        version: "3.9.11"
      maven:
        home: "/usr/share/apache-maven-3.8.8"
    jdk:
      jdk-8: &tool_jdk8
        installers:
          linux-amd64:
            type: "command"
            label: "linux"
            command: "echo JDK8"
            toolHome: "/opt/jdk-8"
          windows-amd64:
            type: "batchFile"
            label: "windows"
            command: "echo JDK8"
            toolHome: "C:/Tools/jdk-8"
          default:
            type: "zip"
            version: "8u382-b05"
      jdk-11: &tool_jdk11
        installers:
          linux-amd64:
            type: "command"
            label: "linux"
            command: "echo JDK11"
            toolHome: "/opt/jdk-11"
          windows-amd64:
            type: "batchFile"
            label: "windows"
            command: "echo JDK11"
            toolHome: "C:/Tools/jdk-11"
          default:
            type: "zip"
            version: "11.0.20+8"
      jdk-17: &tool_jdk17
        installers:
          linux-amd64:
            type: "command"
            label: "linux"
            command: "echo JDK17"
            toolHome: "/opt/jdk-17"
          windows-amd64:
            type: "batchFile"
            label: "windows"
            command: "echo JDK17"
            toolHome: "C:/Tools/jdk-17"
          default:
            type: "zip"
            version: "17.0.11+9"
      jdk-21: &tool_jdk21
        installers:
          linux-amd64:
            type: "command"
            label: "linux"
            command: "echo JDK21"
            toolHome: "/opt/jdk-21"
          windows-amd64:
            type: "batchFile"
            label: "windows"
            command: "echo JDK21"
            toolHome: "C:/Tools/jdk-21"
          default:
            type: "zip"
            version: "21.0.3+9"
      # Use Yaml anchor to avoid repeating configuration
      jdk8: *tool_jdk8
      # Use Yaml anchor to avoid repeating configuration
      jdk11: *tool_jdk11
      jdk17: *tool_jdk17
      jdk21: *tool_jdk21
    generic:
      groovy-3.0.6:
        url: "https://groovy.jfrog.io/artifactory/dist-release-local/groovy-zips/apache-groovy-binary-3.0.6.zip"
      groovy-4.0.22:
        url: "https://groovy.jfrog.io/artifactory/dist-release-local/groovy-zips/apache-groovy-binary-4.0.22.zip"
  cloud_agents:
    azure_vm_agents:
      clouds:
        azure-vms-jenkins-cdf:
          azureCredentialsId: azure-jenkins-cdf-managed-identity # Managed manually
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          resourceGroup: cert-ci-jenkins-io-ephemeral-agents
          maxInstances: 50
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          virtualNetworkName: cert-ci-jenkins-io-vnet
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          virtualNetworkResourceGroupName: cert-ci-jenkins-io
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          subnetName: cert-ci-jenkins-io-vnet-ephemeral-agents
          # TODO: enable Spot after implementing retries to ondemand
          disableSpot: true # Not enough quota available
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          storageAccount: certcijenkinsioagents
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          userInstanceIdentity: '/subscriptions/dff2ec18-6a8e-405c-8e45-b7df7465acf0/resourceGroups/cert-ci-jenkins-io/providers/Microsoft.ManagedIdentity/userAssignedIdentities/cert-ci-jenkins-io-agents'
      agent_definitions:
        - name: "ubuntu-22-amd64-maven-11"
          description: "Ubuntu 22.04 LTS x86_64 with JDK11 set as default java CLI"
          imageDefinition: jenkins-agent-ubuntu-22.04-amd64
          os: "ubuntu"
          os_version: "22.04"
          launcher: "ssh"
          javaHome: "/opt/jdk-11"
          location: "East US 2"
          instanceType: Standard_D8ads_v5 # 8 vCPUS / 32 Gb
          ephemeralOSDisk: true
          spot: false
          architecture: amd64
          labels:
            - linux
            - docker
            - ubuntu
            - ubuntu-amd64-maven-11
            - ubuntu-22-amd64-maven-11
            - maven-11
            - jdk11
          maxInstances: 10 # Quota of 80 vCPUs
          useAsMuchAsPossible: true
          credentialsId: "azure-login"
          usePrivateIP: true
        - name: "ubuntu-22-amd64-maven-17"
          description: "Ubuntu 22.04 LTS x86_64 with JDK17 set as default java CLI"
          imageDefinition: jenkins-agent-ubuntu-22.04-amd64
          os: "ubuntu"
          os_version: "22.04"
          launcher: "ssh"
          location: "East US 2"
          instanceType: Standard_D8ads_v5 # 8 vCPUS / 32 Gb
          ephemeralOSDisk: true
          spot: false
          architecture: amd64
          labels:
            - ubuntu-amd64-maven-17
            - ubuntu-22-amd64-maven-17
            - maven-17
            - jdk17
          javaHome: '/opt/jdk-17'
          maxInstances: 10
          useAsMuchAsPossible: true
          credentialsId: "azure-login"
          usePrivateIP: true
        - name: "ubuntu-22-amd64-maven-21"
          description: "Ubuntu 22.04 LTS x86_64 with JDK21 set as default java CLI"
          imageDefinition: jenkins-agent-ubuntu-22.04-amd64
          os: "ubuntu"
          os_version: "22.04"
          launcher: "ssh"
          location: "East US 2"
          instanceType: Standard_D8ads_v5 # 8 vCPUS / 32 Gb
          ephemeralOSDisk: true
          spot: false
          architecture: amd64
          labels:
            - ubuntu-amd64-maven-21
            - ubuntu-22-amd64-maven-21
            - maven-21
            - jdk21
          javaHome: '/opt/jdk-21'
          maxInstances: 10
          useAsMuchAsPossible: true
          credentialsId: "azure-login"
          usePrivateIP: true
        - name: "win-2019-amd64-maven-11" # The name must not contains "windows" or Azure API complains :facepalm:
          description: "Windows 2019 Maven-11"
          imageDefinition: jenkins-agent-windows-2019-amd64
          os: "windows"
          os_version: "2019"
          launcher: "ssh"
          location: "East US 2"
          instanceType: Standard_D8ads_v5 # 8 vCPUS / 32 Gb
          ephemeralOSDisk: true
          spot: false
          architecture: amd64
          labels:
            - windows
            - docker-windows
            - win-2019
            - windows-2019
            - win-2019-amd64-maven-11
            - maven-windows
            - maven-11-windows
          javaHome: 'C:/tools/jdk-11'
          maxInstances: 10 # Quota of 80 vCPUs
          useAsMuchAsPossible: true
          credentialsId: "azure-login"
          usePrivateIP: true
        - name: "win-2019-amd64-maven-17" # The name must not contains "windows" or Azure API complains :facepalm:
          description: "Windows 2019 Maven-17"
          imageDefinition: jenkins-agent-windows-2019-amd64
          os: "windows"
          os_version: "2019"
          launcher: "ssh"
          location: "East US 2"
          instanceType: Standard_D8ads_v5 # 8 vCPUS / 32 Gb
          ephemeralOSDisk: true
          spot: false
          architecture: amd64
          labels:
            - win-2019-amd64-maven-17
            - maven-17-windows
          javaHome: 'C:/tools/jdk-17'
          maxInstances: 10 # Quota of 80 vCPUs
          useAsMuchAsPossible: true
          credentialsId: "azure-login"
          usePrivateIP: true
        - name: "win-2019-amd64-maven-21" # The name must not contains "windows" or Azure API complains :facepalm:
          description: "Windows 2019 Maven-21"
          imageDefinition: jenkins-agent-windows-2019-amd64
          os: "windows"
          os_version: "2019"
          launcher: "ssh"
          location: "East US 2"
          instanceType: Standard_D8ads_v5 # 8 vCPUS / 32 Gb
          ephemeralOSDisk: true
          spot: false
          architecture: amd64
          labels:
            - win-2019-amd64-maven-21
            - maven-21-windows
          javaHome: 'C:/tools/jdk-21'
          maxInstances: 10 # Quota of 80 vCPUs
          useAsMuchAsPossible: true
          credentialsId: "azure-login"
          usePrivateIP: true
## Ensure we override the default plugins to install defined from hieradata/common.yaml
profile::jenkinscontroller::plugins:
  # System configuration
  - azure-vm-agents
  - configuration-as-code
  - csp
  - generic-tool
  - ldap
  - matrix-auth
  # Basic Pipeline configuration
  - github-branch-source
  - inline-pipeline
  - pipeline-groovy-lib
  # Pipeline steps
  - build-timeout
  - config-file-provider
  - junit-realtime-test-reporter
  - pipeline-stage-step # Used in mavenBuild
  - timestamper
  - workflow-basic-steps
  # Utility
  - better-pipeline-flowgraph-table
  - compact-columns
  - disable-job-button
