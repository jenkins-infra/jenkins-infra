---
lookup_options:
  "^profile::jenkinscontroller::jcasc$":
    merge:
      strategy: deep
      merge_hash_arrays: true
  "^letsencrypt":
    merge:
      strategy: deep
      merge_hash_arrays: true
accounts:
  notmyfault:
    ssh_keys:
      notmyfault_rsa:
        key: 
    groups:
      - sudo
  kevingrdj:
    ssh_keys:
      potatoes:
        key: 
docker::log_opt::max-size: "100m"
docker::log_opt::max-file: 2
# Per-host Datadog configuration
datadog_agent::host: "controller.trusted.ci.jenkins.io"
profile::jenkinscontroller::ci_fqdn: "trusted.ci.jenkins.io"
profile::jenkinscontroller::ci_resource_domain: 'assets.trusted.ci.jenkins.io'
profile::jenkinscontroller::admin_ldap_groups:
  - admins
  - trusted-admins
profile::jenkinscontroller::letsencrypt: true
profile::letsencrypt::plugin: dns-multi
profile::letsencrypt::dns_azure:
  use_workload_identity: true
  tenant_id: "4c45fef2-1ba7-4120-80a0-9e2d03e9c2b6" # application_tenant_id
  zone:
    name: "trusted.ci.jenkins.io"
    subscription: "dff2ec18-6a8e-405c-8e45-b7df7465acf0"
    resource_group_name: "proddns_jenkinsio"
profile::jenkinscontroller::groovy_init_enabled: true
profile::jenkinscontroller::groovy_d_lock_down_jenkins: "present"
profile::jenkinscontroller::groovy_d_set_up_git: "present"
profile::jenkinscontroller::memory_limit: '4g'
profile::jenkinscontroller::jcasc:
  enabled: true
  reload_token: ENC[PKCS7,]
  datadog_api_key: ENC[PKCS7,]
  appearance:
    pipeline_graph_view:
      on_build_page: true
      on_job_page: false
  tools:
    groovy:
      groovy: # Default version is named "groovy"
        version: "2.4.21"
    jdk:
      jdk8:
        installers:
          linux-amd64: "(linux && amd64) || linux-amd64 || jdk8 || jdk-8 || maven-8 || updatecenter || census"
      jdk17:
        installers:
          linux-amd64: "(linux && amd64) || linux-amd64 || jdk8 || jdk-8 || maven-8 || updatecenter || census"
      jdk21:
        installers:
          linux-amd64: "(linux && amd64) || linux-amd64 || jdk8 || jdk-8 || maven-8 || updatecenter || census"
      jdk25:
        installers:
          linux-amd64: "(linux && amd64) || linux-amd64 || jdk8 || jdk-8 || maven-8 || updatecenter || census"
  permanent_agents:
    agent-1:
      remoteFS: /home/jenkins/agent-workspace
      numExecutors: 2
      mode: EXCLUSIVE
      labels:
        - updatecenter
        - census
      ssh:
        host: "agent.trusted.ci.jenkins.io"
        credentialsId: "trusted-agent-1-ssh-key"
        maxNumRetries: 0
        retryWaitTime: 0
        hostKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFKPicazcvpcZB+u1AFnOcD69JQwACxgaFnYk86ckXoB"
  cloud_agents:
    azure_vm_agents:
      clouds:
        azure-vms-jenkins-cdf:
          azureCredentialsId: azure-jenkins-cdf-managed-identity # Managed manually
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          resourceGroup: trusted-ci-jenkins-io-ephemeral-agents
          maxInstances: 50
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          virtualNetworkName: trusted-ci-jenkins-io-vnet
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          virtualNetworkResourceGroupName: trusted-ci-jenkins-io
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          subnetName: trusted-ci-jenkins-io-vnet-ephemeral-agents
          # TODO: enable Spot after implementing retries to ondemand
          disableSpot: true # Not enough quota available
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          storageAccount: trustedcijenkinsioagents
          # TODO: track with updatecli from https://reports.jenkins.io/jenkins-infra-data-reports/azure.json
          userInstanceIdentity: '/subscriptions/dff2ec18-6a8e-405c-8e45-b7df7465acf0/resourceGroups/jenkinsinfra-trusted-ci-controller/providers/Microsoft.ManagedIdentity/userAssignedIdentities/trusted-ci-jenkins-io-agents'
          agent_definitions:
            - name: "ubuntu-22-amd64-maven-11"
              description: "Ubuntu 22.04 LTS x86_64 with JDK11 set as default java CLI"
              imageDefinition: jenkins-agent-ubuntu-22.04-amd64
              os: "ubuntu"
              os_version: "22.04"
              launcher: "ssh"
              javaHome: "/opt/jdk-11"
              location: "East US 2"
              instanceType: Standard_D8ads_v5 # 8 vCPUS / 32 Gb
              ephemeralOSDisk: true
              spot: true
              architecture: amd64
              labels:
                - java
                - linux
                - docker
                - ubuntu
                - ubuntu-22
                - ubuntu-amd64-maven-11
                - ubuntu-22-amd64-maven-11
                - maven-11
                - jdk11
              maxInstances: 7
              useAsMuchAsPossible: true
              credentialsId: "azure-jenkins-user"
              usePrivateIP: true
            - name: "ubuntu-22-amd64-maven-17"
              description: "Ubuntu 22.04 LTS x86_64 with JDK17 set as default java CLI"
              imageDefinition: jenkins-agent-ubuntu-22.04-amd64
              os: "ubuntu"
              os_version: "22.04"
              launcher: "ssh"
              location: "East US 2"
              instanceType: Standard_D8ads_v5 # 8 vCPUS / 32 Gb
              ephemeralOSDisk: true
              spot: true
              architecture: amd64
              labels:
                - ubuntu-amd64-maven-17
                - ubuntu-22-amd64-maven-17
                - maven-17
                - jdk17
              javaHome: '/opt/jdk-17'
              maxInstances: 7
              useAsMuchAsPossible: true
              credentialsId: "azure-jenkins-user"
              usePrivateIP: true
            - name: "ubuntu-22-amd64-maven-21"
              description: "Ubuntu 22.04 LTS x86_64 with JDK21 set as default java CLI"
              imageDefinition: jenkins-agent-ubuntu-22.04-amd64
              os: "ubuntu"
              os_version: "22.04"
              launcher: "ssh"
              location: "East US 2"
              instanceType: Standard_D8ads_v5 # 8 vCPUS / 32 Gb
              ephemeralOSDisk: true
              spot: true
              architecture: amd64
              labels:
                - ubuntu-amd64-maven-21
                - ubuntu-22-amd64-maven-21
                - maven-21
                - jdk21
              javaHome: '/opt/jdk-21'
              maxInstances: 7
              useAsMuchAsPossible: true
              credentialsId: "azure-jenkins-user"
              usePrivateIP: true
            - name: "ubuntu-22-arm64-maven-21"
              description: "Ubuntu 22.04 LTS arm64 with JDK21 set as default java CLI"
              imageDefinition: jenkins-agent-ubuntu-22.04-arm64
              os: "ubuntu"
              os_version: "22.04"
              launcher: "ssh"
              location: "East US 2"
              instanceType: Standard_D8pds_v5 # 8 vCPUS / 32 Gb
              ephemeralOSDisk: true
              spot: true
              architecture: arm64
              labels:
                - ubuntu-arm64-maven-21
                - ubuntu-22-arm64-maven-21
                - arm64docker # Same label as ci.jenkins.io docker arm64 agent template
              javaHome: '/opt/jdk-21'
              maxInstances: 7
              useAsMuchAsPossible: true
              credentialsId: "azure-jenkins-user"
              usePrivateIP: true
            - name: "ubuntu-22-amd64-maven-25"
              description: "Ubuntu 22.04 LTS x86_64 with JDK25 set as default java CLI"
              imageDefinition: jenkins-agent-ubuntu-22.04-amd64
              os: "ubuntu"
              os_version: "22.04"
              launcher: "ssh"
              location: "East US 2"
              instanceType: Standard_D8ads_v5 # 8 vCPUS / 32 Gb
