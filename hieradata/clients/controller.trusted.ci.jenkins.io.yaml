# These are plugins we need only in our trusted-ci environment
profile::jenkinscontroller::plugins:
  - ansicolor
  - azure-vm-agents
  - build-timeout
  - buildtriggerbadge
  - cloudbees-folder
  - configuration-as-code
  - credentials
  - credentials-binding
  - docker-workflow
  - disable-job-button
  - git-client
  - git
  - github
  - github-branch-source
  - groovy
  - jobConfigHistory
  - ldap
  - lockable-resources
  - mailer
  - parallel-test-executor
  - pipeline-stage-view
  - pipeline-utility-steps
  - ssh-agent # SSH Agent to allow loading SSH credentials on a local agent for jobs
  - ssh-slaves # SSH Build Agent to implement "outbound agents"
  - throttle-concurrents
  - timestamper
  - workflow-aggregator
  - workflow-multibranch
