---
name: Bump OpenVPN version and configuration

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  latestVersion:
    kind: githubrelease
    name: Get the latest stable docker-openvpn version
    spec:
      owner: jenkins-infra
      repository: docker-openvpn
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versionfilter:
        kind: semver
  getUpdatedHieradataCommon:
    kind: shell
    spec:
      command: bash ./updatecli/scripts/update-vpn-routes.sh {{ source "latestVersion" }} servers
  getUpdatedHieradataOpenVPN:
    kind: shell
    spec:
      command: bash ./updatecli/scripts/update-vpn-routes.sh {{ source "latestVersion" }} networks

conditions:
  testdockerimageExist:
    kind: dockerimage
    sourceid: latestVersion
    spec:
      image: dockerhubmirror.azurecr.io/jenkinsciinfra/openvpn
      # Tag comes from the source input value
      architectures:
      - amd64
      - arm64
  checkIfKeyExist:
    kind: yaml
    disablesourceinput: true
    spec:
      file: hieradata/common.yaml
      keyonly: true
      key: $.profile::openvpn::image_tag

targets:
  updateNetworkRoutes:
    name: Update external server routes in ./hieradata/common.yaml
    kind: file
    sourceid: getUpdatedHieradataCommon
    spec:
      file: ./hieradata/common.yaml
    scmid: default
  updateNetworkNetworks:
    name: Update VPN network routes in ./hieradata/clients/private.vpn.jenkins.io.yaml
    kind: file
    sourceid: getUpdatedHieradataOpenVPN
    spec:
      file: ./hieradata/clients/private.vpn.jenkins.io.yaml
    scmid: default
  imageTag:
    name: Update Docker Image tag for jenkinsciinfra/openvpn
    kind: yaml
    sourceid: latestVersion
    dependson:
    - updateNetworkNetworks
    spec:
      file: hieradata/common.yaml
      key: $.profile::openvpn::image_tag
    scmid: default

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: Bump OpenVPN version and configuration
    spec:
      labels:
        - dependencies
