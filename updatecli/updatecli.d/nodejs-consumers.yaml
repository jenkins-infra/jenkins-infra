---
name: Track NodeJS version from production agents in consumer projects

scms:
  plugin-site:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: plugin-site
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: main
  stories:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: stories
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: main

sources:
  # Hop 1: which packer-image version is deployed in production
  getPackerImageDeployedVersion:
    kind: yaml
    name: Retrieve the current version of the Packer images used in production
    spec:
      file: hieradata/common.yaml
      key: $.profile::jenkinscontroller::jcasc.agent_images.azure_vms_gallery_image.version
  # Hop 2: the NodeJS (Linux) version baked into that packer-image release
  getNodeJSVersionFromPackerImages:
    kind: yaml
    name: Get the NodeJS Linux version set in the production Packer images
    dependson:
      - getPackerImageDeployedVersion
    spec:
      file: https://raw.githubusercontent.com/jenkins-infra/packer-images/{{ source "getPackerImageDeployedVersion" }}/provisioning/tools-versions.yml
      key: $.nodejs_linux_version

targets:
  plugin-site:
    name: Bump NodeJS version in plugin-site .tool-versions
    kind: file
    sourceid: getNodeJSVersionFromPackerImages
    scmid: plugin-site
    transformers:
      - addprefix: "nodejs "
    spec:
      file: .tool-versions
      matchpattern: 'nodejs .*'
  stories:
    name: Bump NodeJS version in stories .tool-versions
    kind: file
    sourceid: getNodeJSVersionFromPackerImages
    scmid: stories
    transformers:
      - addprefix: "nodejs "
    spec:
      file: .tool-versions
      matchpattern: 'nodejs .*'

actions:
  plugin-site:
    kind: github/pullrequest
    scmid: plugin-site
    title: Bump NodeJS version to {{ source "getNodeJSVersionFromPackerImages" }}
    spec:
      labels:
        - dependencies
        - nodejs
  stories:
    kind: github/pullrequest
    scmid: stories
    title: Bump NodeJS version to {{ source "getNodeJSVersionFromPackerImages" }}
    spec:
      labels:
        - dependencies
        - nodejs
