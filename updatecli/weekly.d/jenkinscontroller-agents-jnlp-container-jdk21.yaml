---
name: Bump JNLP Container Agent Image jenkins/inbound-agent (JDK21)

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  getLatestInboundJDK21ContainerImage:
    kind: dockerdigest
    spec:
      image: "jenkins/inbound-agent"
      tag: "latest-jdk21"
      architecture: amd64

targets:
  setInboundJDK21ContainerImage:
    sourceid: getLatestInboundJDK21ContainerImage
    name: "Bump container agent image jenkins/inbound-agent (JDK21)"
    kind: yaml
    spec:
      file: hieradata/common.yaml
      key: $.profile::jenkinscontroller::jcasc.agent_images.container_images.jnlp
    transformers:
      - addprefix: "jenkins/inbound-agent:"
    scmid: default

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: Bump JNLP Container Agent Image jenkins/inbound-agent (JDK21) to {{ source "getLatestInboundJDK21ContainerImage" }}
    spec:
      labels:
        - dependencies
