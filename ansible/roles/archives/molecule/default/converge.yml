---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600

    - name: Install UFW for testing
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Start ufw
      ansible.builtin.systemd:
        name: ufw
        state: started
        enabled: true

    - name: Install OpenSSL for testing certificates
      ansible.builtin.apt:
        name: openssl
        state: present

    - name: Create Let's Encrypt directory structure for testing
      ansible.builtin.file:
        path: "/etc/letsencrypt/live/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "archives-test.local"
        - "archives-legacy-test.local"

    - name: Generate self-signed certificates for testing
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/letsencrypt/live/{{ item }}/privkey.pem
        -out /etc/letsencrypt/live/{{ item }}/fullchain.pem
        -subj "/C=US/ST=Test/L=Test/O=Test/CN={{ item }}"
      loop:
        - "archives-test.local"
        - "archives-legacy-test.local"
      args:
        creates: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"

  roles:
    - jenkins_infra.archives
